# ==========================================================================
# Student Management System - Backend Production Configuration
# ==========================================================================

spring.application.name=student-management-backend

# ---- Server ----
server.port=${PORT:8080}

# ---- MySQL connection (Supports environment variables for Docker/Production) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:student_management}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQL_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- SQL Initialization (Handled dynamically by Hibernate + DataSeeder) ----
spring.sql.init.mode=never

# ---- Actuator Health Monitoring ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ---- Demo Admin Credentials ----
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
